<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raka's Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="widget calendar">
        <p>MONDAY</p>
        <ul>
          <li>Lunch 12:00–13:00</li>
          <li>Dinner 19:00–19:00</li>
          <li>Prepare Content 13:30–18:00</li>
          <li>Nightroutine 20:00–21:00</li>
        </ul>
      </div>

      <div class="apps">
        <img src="icons/calender.jpg" alt="Calendar">
        <img src="icons/catatan.jpg" alt="Notes">
        <img src="icons/mail.jpg" alt="Mail">
        <img src="icons/pesan.jpg" alt="Messages">
      </div>

      <div class="dock">
        <img src="icons/pengaturan.jpg" alt="Settings">
        <img src="icons/safari.jpg" alt="Safari">
        <img src="icons/call.jpg" alt="Phone">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
